<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will-Pay → Fair Odds</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; margin: 0; padding: 16px; background: #0f1419; color: #e8eaed; font-size: 16px; line-height: 1.4; }
  h1 { font-size: 20px; margin: 0 0 4px 0; font-weight: 600; }
  .sub { font-size: 13px; color: #8a929c; margin-bottom: 16px; }
  textarea, input[type="text"], input[type="number"] { width: 100%; background: #1a2029; color: #e8eaed; border: 1px solid #2a3340; border-radius: 8px; padding: 10px; font-size: 14px; -webkit-appearance: none; }
  textarea { min-height: 100px; font-family: ui-monospace, "SF Mono", monospace; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: #4a90e2; }
  .btn-row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button { flex: 1; min-width: 120px; background: #4a90e2; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
  button.secondary { background: #2a3340; color: #e8eaed; }
  button:active { opacity: 0.7; }
  .pool-block { background: #151a22; border: 1px solid #2a3340; border-radius: 12px; padding: 12px; margin-bottom: 12px; border-left-width: 3px; border-left-style: solid; }
  .pool-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .pool-label-input { background: transparent; border: none; font-weight: 600; font-size: 15px; padding: 2px 4px; flex: 1; min-width: 0; }
  .small-btn { flex: 0 0 auto; padding: 4px 10px; font-size: 12px; min-width: 0; }
  .step-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8a929c; margin: 16px 0 6px 0; font-weight: 600; }
  .review-table { background: #1a2029; border-radius: 10px; overflow: hidden; margin-top: 8px; }
  .review-row { display: grid; grid-template-columns: 44px 1fr 100px 56px; gap: 6px; align-items: center; padding: 6px; border-bottom: 1px solid #2a3340; }
  .review-row:last-child { border-bottom: none; }
  .review-row.scratched { opacity: 0.5; }
  .review-row input { padding: 6px; font-size: 13px; }
  .review-row input.pgm { text-align: center; font-weight: 700; }
  .review-row input.amt { text-align: right; font-variant-numeric: tabular-nums; }
  .scr-toggle { background: #2a3340; border: 1px solid #3a4350; color: #8a929c; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
  .scr-toggle.active { background: #6a4a2a; color: #ffb84a; border-color: #8a6a3a; }
  .results-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.results { width: 100%; border-collapse: collapse; margin-top: 8px; background: #1a2029; border-radius: 10px; overflow: hidden; min-width: 100%; }
  table.results th, table.results td { padding: 8px 6px; text-align: left; font-size: 12px; border-bottom: 1px solid #2a3340; white-space: nowrap; }
  table.results th { background: #232b36; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #8a929c; }
  table.results td.num { font-variant-numeric: tabular-nums; text-align: right; }
  table.results td.pgm { font-weight: 700; width: 28px; text-align: center; }
  table.results tr.scr { opacity: 0.4; }
  table.results .name { font-weight: 500; min-width: 110px; white-space: normal; }
  .footer-note { font-size: 12px; color: #6a737d; text-align: center; margin-top: 16px; line-height: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 4px; padding: 2px 8px; background: #1a2029; border-radius: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .controls { background: #151a22; border: 1px solid #2a3340; border-radius: 10px; padding: 10px 12px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; }
  .control-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .control-label { color: #8a929c; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; font-weight: 600; }
  .seg { display: flex; background: #0f1419; border-radius: 6px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; min-width: 0; background: transparent; color: #8a929c; padding: 6px 8px; font-size: 11px; font-weight: 600; border-radius: 4px; }
  .seg button.active { background: #2a3340; color: #e8eaed; }
  .bet-cell { font-size: 11px; line-height: 1.3; }
  .bet-cell .target { font-weight: 600; color: #5cb85c; }
  .bet-cell .label { font-size: 9px; color: #8a929c; text-transform: uppercase; letter-spacing: 0.3px; }
  .live-input {
    width: 90px !important;
    min-width: 90px !important;
    height: 44px !important;
    padding: 8px 10px !important;
    font-size: 16px !important;
    line-height: 1 !important;
    text-align: center !important;
    font-variant-numeric: tabular-nums;
    background: #ffffff !important;
    border: 2px solid #4a90e2 !important;
    border-radius: 8px !important;
    color: #000000 !important;
    -webkit-text-fill-color: #000000 !important;
    -webkit-appearance: none !important;
    appearance: none !important;
    caret-color: #000000 !important;
  }
  .live-input:focus {
    border-color: #5cb85c !important;
    outline: none !important;
  }
  .verdict { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
  .verdict.bet { background: #1a3a1a; color: #5cb85c; border: 1px solid #2a5a2a; }
  .verdict.close { background: #3a3a1a; color: #ffb84a; border: 1px solid #5a5a2a; }
  .verdict.pass { background: #2a1a1a; color: #e85d75; border: 1px solid #4a2a2a; }
  .edge-pct { font-size: 10px; color: #8a929c; margin-top: 1px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<h1>Will-Pay → Fair Odds</h1>
<div class="sub">Paste up to 5 pools to compare fair odds across them.</div>

<div id="pools-container"></div>

<div class="btn-row">
  <button class="secondary" onclick="addPool()" id="addBtn">+ Add pool</button>
</div>

<div class="btn-row">
  <button onclick="parseAll()">Parse</button>
</div>

<div class="btn-row">
  <button onclick="calculate()">Calculate</button>
  <button class="secondary" onclick="clearAll()">Clear</button>
</div>

<div id="output"></div>

<div class="footer-note">
  One pool → fair odds. Multiple pools → comparison showing where each pool ranks each horse.
</div>

<script>
const POOL_COLORS = ['#4a90e2', '#b97aff', '#5cb85c', '#f0ad4e', '#e85d75'];
const DEFAULT_LABELS = ['Pick-6', 'Pick-5', 'Pick-4', 'Pick-3', 'Double'];

const POOL_DEPTH = { 'Pick-6': 6, 'Pick-5': 5, 'Pick-4': 4, 'Pick-3': 3, 'Double': 2 };

let pools = [];
let nextId = 1;

let edgeThreshold = 0.20;
let anchorMode = 'sharpest';

let liveOdds = {};

function init() { addPool(); }

function addPool() {
  if (pools.length >= 5) return;
  const idx = pools.length;
  const pool = {
    id: nextId++,
    label: DEFAULT_LABELS[idx] || `Pool ${idx+1}`,
    color: POOL_COLORS[idx],
    horses: [],
    inputText: ''
  };
  pools.push(pool);
  renderPools();
}

function removePool(id) {
  pools = pools.filter(p => p.id !== id);
  document.getElementById('output').innerHTML = '';
  renderPools();
}

function renderPools() {
  const container = document.getElementById('pools-container');
  container.innerHTML = '';
  pools.forEach((p) => {
    const block = document.createElement('div');
    block.className = 'pool-block';
    block.style.borderLeftColor = p.color;
    block.innerHTML = `
      <div class="pool-header">
        <input class="pool-label-input" style="color:${p.color}" id="label-${p.id}" value="${escapeHtml(p.label)}" oninput="updateLabel(${p.id}, this.value)" />
        ${pools.length > 1 ? `<button class="secondary small-btn" onclick="removePool(${p.id})">Remove</button>` : ''}
      </div>
      <textarea id="input-${p.id}" placeholder="Paste OCR'd will-pays for ${escapeHtml(p.label)}..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="updateInputText(${p.id}, this.value)">${escapeHtml(p.inputText)}</textarea>
      <div id="review-${p.id}"></div>
    `;
    container.appendChild(block);
    if (p.horses.length > 0) renderReview(p);
  });
  document.getElementById('addBtn').style.display = pools.length >= 5 ? 'none' : '';
}

function updateLabel(id, val) {
  const p = pools.find(p => p.id === id);
  if (p) p.label = val;
}

function updateInputText(id, val) {
  const p = pools.find(p => p.id === id);
  if (p) p.inputText = val;
}

function reorderColumnOCR(lines) {
  const amountIdx = lines.findIndex(l => /^\$[\d,]+\.\d{2}$/.test(l));
  if (amountIdx === -1) return lines;
  const before = lines.slice(0, amountIdx);
  const after = lines.slice(amountIdx);
  const beforeHasAmounts = before.some(l => /^\$[\d,]+\.\d{2}$/.test(l));
  const afterAmountCount = after.filter(l => /^\$[\d,]+\.\d{2}$/.test(l)).length;
  const afterNonAmountCount = after.filter(l => /[a-zA-Z]/.test(l) && !/^\$/.test(l)).length;
  const afterHasPgm = after.some(l => /^\d{1,2}$/.test(l) && parseInt(l) >= 1 && parseInt(l) <= 20);
  if (beforeHasAmounts || afterAmountCount < 2 || afterNonAmountCount > afterAmountCount || afterHasPgm) return lines;

  const isHeaderJunk = (line) => {
    if (/^\$[\d.]+\s*(Pick|Double|PICK)/i.test(line)) return true;
    if (/^[\d,]+\s*\/\s*[\d,]+/.test(line)) return true;
    if (/WITH$/i.test(line)) return true;
    if (/^PAYS$/i.test(line)) return true;
    if (/^(POOLS|PROBABLES|WILL PAYS|RACE\s*\d)$/i.test(line)) return true;
    return false;
  };

  const pairs = [];
  let curPgm = null;
  for (const line of before) {
    if (isHeaderJunk(line)) continue;
    if (/^\d{1,2}$/.test(line) && parseInt(line) >= 1 && parseInt(line) <= 20) {
      curPgm = line;
    } else if (/[a-zA-Z]/.test(line) && curPgm !== null) {
      pairs.push({ pgm: curPgm, name: line });
      curPgm = null;
    } else if (/[a-zA-Z]/.test(line)) {
      pairs.push({ pgm: null, name: line });
    }
  }
  const amounts = after.filter(l => /^\$[\d,]+\.\d{2}$/.test(l) || /^[—\-]+$/.test(l));
  const result = [];
  for (let i = 0; i < pairs.length; i++) {
    if (pairs[i].pgm) result.push(pairs[i].pgm);
    result.push(pairs[i].name);
    if (i < amounts.length) result.push(amounts[i]);
  }
  return result;
}

function parseWillPays(text) {
  let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  lines = reorderColumnOCR(lines);
  let betType = '', liveLegs = '';
  for (const line of lines) {
    if (/\$[\d.]+\s*(Pick-?\d|PICK\s*(SIX|FIVE|FOUR|THREE|TWO)|Double|Daily Double)/i.test(line)) betType = line;
    if (/Results?:\s*[\d/*\-,]+/i.test(line)) liveLegs = line;
    if (/^\d+\s*\/\s*\d+/.test(line) && /WITH|PAYS/i.test(line)) liveLegs = line;
    if (/^[\d,]+\s*\/\s*[\d,]+/.test(line) && /WITH|PAYS/i.test(line)) liveLegs = line;
  }
  const isJunk = (line) => {
    if (/^(POOLS|PROBABLES|WILL PAYS|MORE|MORER|DOUBLE|PICK-?\d|RACE\s*\d|OFFICIAL|HOME|RACES|MY BETS|OFFERS|DEPOSIT|PAYS)$/i.test(line)) return true;
    if (/RACING$/i.test(line)) return true;
    if (/DOWNS$/i.test(line)) return true;
    if (/^MOUNTAINEER$/i.test(line)) return true;
    if (/PARK$/i.test(line)) return true;
    if (/^\d{1,2}:\d{2}/.test(line)) return true;
    if (/^\(?\d{1,3}\)?$/.test(line) && parseInt(line.replace(/[()]/g,'')) > 20) return true;
    if (/^Results?:/i.test(line)) return true;
    if (/^\$[\d.]+\s*(Pick|Double|PICK)/i.test(line)) return true;
    if (/^X$/i.test(line)) return true;
    if (/^[+]?\$$/.test(line)) return true;
    if (/^[<>]+$/.test(line)) return true;
    if (/^[\u3008\u3009\u2039\u203A\u00AB\u00BB\u3001\u3002]+$/.test(line)) return true;
    if (/^\d+\s*\/\s*\d/.test(line)) return true;
    if (/^[\d,]+\s*\/\s*[\d,]/.test(line)) return true;
    if (/[\d,]+\s*\/\s*[\d,]+.*WITH/i.test(line)) return true;
    return false;
  };
  const tokens = [];
  for (const line of lines) {
    if (isJunk(line)) continue;
    const numMatch = line.match(/^(\d{1,2})$/);
    if (numMatch) {
      const n = parseInt(numMatch[1]);
      if (n >= 1 && n <= 20) { tokens.push({ type: 'pgm', value: n }); continue; }
    }
    if (/^SCR$/i.test(line)) { tokens.push({ type: 'scr' }); continue; }
    if (/^\$[\d,]+\.\d{2}$/.test(line)) {
      tokens.push({ type: 'amount', value: parseFloat(line.replace(/[$,]/g, '')) }); continue;
    }
    if (/^[—\-ー]+$/.test(line)) { tokens.push({ type: 'dash' }); continue; }
    if (/[a-zA-Z]/.test(line)) { tokens.push({ type: 'name', value: line }); continue; }
  }
  const horses = [];
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i].type !== 'name') continue;
    const nameIdx = i;
    let pgmNum = null, scratched = false;
    for (let j = nameIdx - 1; j >= Math.max(0, nameIdx - 3); j--) {
      const t = tokens[j];
      if (t.type === 'name') break;
      if (t.type === 'pgm' && pgmNum === null) pgmNum = t.value;
      if (t.type === 'scr') scratched = true;
    }
    let willPay = null;
    for (let j = nameIdx + 1; j < tokens.length; j++) {
      const t = tokens[j];
      if (t.type === 'name') break;
      if (t.type === 'pgm') break;
      if (t.type === 'scr') { scratched = true; continue; }
      if (t.type === 'amount') { willPay = t.value; break; }
      if (t.type === 'dash') { scratched = true; break; }
    }
    if (willPay === null) scratched = true;
    horses.push({ num: pgmNum, name: tokens[nameIdx].value, scratched, willPay });
  }
  let lastKnown = 0;
  for (let i = 0; i < horses.length; i++) {
    if (horses[i].num !== null) lastKnown = horses[i].num;
    else { horses[i].num = lastKnown + 1; lastKnown = horses[i].num; }
  }
  return { horses, betType, liveLegs };
}

function inferLabelFromBet(text) {
  if (/PICK\s*SIX|Pick-?6/i.test(text)) return 'Pick-6';
  if (/PICK\s*FIVE|Pick-?5/i.test(text)) return 'Pick-5';
  if (/PICK\s*FOUR|Pick-?4/i.test(text)) return 'Pick-4';
  if (/PICK\s*THREE|Pick-?3/i.test(text)) return 'Pick-3';
  if (/Daily Double|DOUBLE/i.test(text)) return 'Double';
  return null;
}

function parseAll() {
  for (const p of pools) {
    if (!p.inputText.trim()) { p.horses = []; continue; }
    const r = parseWillPays(p.inputText);
    p.horses = r.horses;
    const lbl = inferLabelFromBet(p.inputText);
    if (lbl) p.label = lbl;
  }
  renderPools();
}

function renderReview(pool) {
  const el = document.getElementById('review-' + pool.id);
  if (!el) return;
  if (pool.horses.length === 0) { el.innerHTML = ''; return; }
  let html = '<div class="review-table">';
  pool.horses.forEach((h, i) => {
    html += `<div class="review-row${h.scratched ? ' scratched' : ''}">
      <input class="pgm" style="color:${pool.color}" type="number" inputmode="numeric" value="${h.num}" onchange="updateHorse(${pool.id}, ${i}, 'num', this.value)" />
      <input type="text" value="${escapeHtml(h.name)}" onchange="updateHorse(${pool.id}, ${i}, 'name', this.value)" />
      <input class="amt" type="text" inputmode="decimal" value="${h.scratched ? '' : (h.willPay ?? '')}" placeholder="${h.scratched ? 'SCR' : '0.00'}" onchange="updateHorse(${pool.id}, ${i}, 'willPay', this.value)" ${h.scratched ? 'disabled' : ''} />
      <button class="scr-toggle ${h.scratched ? 'active' : ''}" onclick="toggleScr(${pool.id}, ${i})">SCR</button>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function updateHorse(poolId, i, field, value) {
  const p = pools.find(p => p.id === poolId);
  if (!p) return;
  if (field === 'num') p.horses[i].num = parseInt(value) || 0;
  else if (field === 'name') p.horses[i].name = value;
  else if (field === 'willPay') {
    const v = parseFloat(String(value).replace(/[$,]/g, ''));
    p.horses[i].willPay = isNaN(v) ? null : v;
  }
}

function toggleScr(poolId, i) {
  const p = pools.find(p => p.id === poolId);
  if (!p) return;
  p.horses[i].scratched = !p.horses[i].scratched;
  if (p.horses[i].scratched) p.horses[i].willPay = null;
  renderReview(p);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function calcFair(horses) {
  const live = horses.filter(h => !h.scratched && h.willPay !== null && h.willPay > 0);
  if (live.length === 0) return;
  const rawSum = live.reduce((s, h) => s + (1 / h.willPay), 0);
  for (const h of horses) {
    if (h.scratched || h.willPay === null || h.willPay <= 0) { h.impliedProb = null; h.fairOdds = null; }
    else {
      h.impliedProb = (1 / h.willPay) / rawSum;
      h.fairOdds = (1 / h.impliedProb) - 1;
    }
  }
}

function targetOdds(p, edgeMult) {
  if (!p || p <= 0) return null;
  return (edgeMult / p) - 1;
}

function getSharpestPool(activePools) {
  let sharpest = activePools[0];
  let bestDepth = POOL_DEPTH[sharpest.label] || 0;
  for (const p of activePools) {
    const d = POOL_DEPTH[p.label] || 0;
    if (d > bestDepth) { bestDepth = d; sharpest = p; }
  }
  return sharpest;
}

function getShallowestPool(activePools) {
  let shallow = activePools[0];
  let worstDepth = POOL_DEPTH[shallow.label] || 99;
  for (const p of activePools) {
    const d = POOL_DEPTH[p.label] || 99;
    if (d < worstDepth) { worstDepth = d; shallow = p; }
  }
  return shallow;
}

function parseLiveOdds(s) {
  if (!s || typeof s !== 'string') return null;
  const cleaned = s.trim();
  if (!cleaned) return null;
  const fracMatch = cleaned.match(/^(\d+(?:\.\d+)?)\s*[\/\-]\s*(\d+(?:\.\d+)?)$/);
  if (fracMatch) {
    const num = parseFloat(fracMatch[1]);
    const den = parseFloat(fracMatch[2]);
    if (den > 0) return num / den;
  }
  const v = parseFloat(cleaned);
  if (!isNaN(v) && v >= 0) return v;
  return null;
}

function computeEdge(fairProb, liveOddsX1) {
  if (!fairProb || fairProb <= 0 || liveOddsX1 === null || liveOddsX1 < 0) return null;
  return fairProb * (liveOddsX1 + 1) - 1;
}

function setLiveOdds(num, value) {
  const parsed = parseLiveOdds(value);
  if (parsed === null) {
    delete liveOdds[num];
  } else {
    liveOdds[num] = parsed;
  }
  calculate();
}

function calculate() {
  const activePools = pools.filter(p => p.horses.length > 0);
  if (activePools.length === 0) { alert('Parse at least one pool first.'); return; }
  for (const p of activePools) calcFair(p.horses);
  const out = document.getElementById('output');
  let html = '<div class="step-label">Fair Odds</div>';
  html += renderControls(activePools);
  if (activePools.length === 1) html += renderSingle(activePools[0]);
  else html += renderComparison(activePools);
  out.innerHTML = html;
}

function renderControls(activePools) {
  const thresholds = [
    { val: 0.10, label: '+10%' },
    { val: 0.15, label: '+15%' },
    { val: 0.20, label: '+20%' },
    { val: 0.25, label: '+25%' }
  ];
  let html = '<div class="controls">';
  html += '<div class="control-group"><div class="control-label">Edge Target</div><div class="seg">';
  for (const t of thresholds) {
    html += `<button class="${Math.abs(edgeThreshold - t.val) < 0.001 ? 'active' : ''}" onclick="setEdge(${t.val})">${t.label}</button>`;
  }
  html += '</div></div>';
  if (activePools.length >= 2) {
    html += '<div class="control-group"><div class="control-label">Anchor</div><div class="seg">';
    html += `<button class="${anchorMode === 'sharpest' ? 'active' : ''}" onclick="setAnchor('sharpest')">Sharpest</button>`;
    html += `<button class="${anchorMode === 'consensus' ? 'active' : ''}" onclick="setAnchor('consensus')">Avg</button>`;
    html += `<button class="${anchorMode === 'dual' ? 'active' : ''}" onclick="setAnchor('dual')">Both</button>`;
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

function setEdge(v) { edgeThreshold = v; calculate(); }
function setAnchor(m) { anchorMode = m; calculate(); }

function formatOdds(x) {
  if (x === null || x === undefined || !isFinite(x)) return '—';
  if (x < 0) return '<0';
  if (x < 10) return x.toFixed(1) + '-1';
  return Math.round(x) + '-1';
}

function getVerdict(fairProb, num) {
  const live = liveOdds[num];
  if (live === undefined || live === null) return null;
  const edge = computeEdge(fairProb, live);
  if (edge === null) return null;
  let v;
  if (edge >= edgeThreshold) v = 'bet';
  else if (edge >= edgeThreshold * 0.5) v = 'close';
  else v = 'pass';
  return { verdict: v, edge };
}

function renderVerdictCell(num, fairProb) {
  const live = liveOdds[num];
  const liveStr = (live !== undefined && live !== null) ? (live < 10 ? live.toFixed(1) : Math.round(live).toString()) : '';
  let html = `<td><input class="live-input" type="text" inputmode="decimal" placeholder="—" value="${liveStr}" onchange="setLiveOdds(${num}, this.value)" onclick="this.select()" /></td>`;
  if (live === undefined || live === null || !fairProb) {
    html += `<td class="num">—</td>`;
    return html;
  }
  const v = getVerdict(fairProb, num);
  if (!v) { html += `<td class="num">—</td>`; return html; }
  const edgePct = (v.edge * 100);
  const edgeStr = (edgePct >= 0 ? '+' : '') + edgePct.toFixed(1) + '%';
  let label = v.verdict === 'bet' ? 'BET' : (v.verdict === 'close' ? 'CLOSE' : 'PASS');
  html += `<td><div class="verdict ${v.verdict}">${label}</div><div class="edge-pct">${edgeStr}</div></td>`;
  return html;
}

function renderSingle(pool) {
  const sorted = [...pool.horses].sort((a, b) => (a.num || 0) - (b.num || 0));
  const edgeMult = 1 + edgeThreshold;
  let html = '<div class="results-wrap"><table class="results"><thead><tr>';
  html += `<th>#</th><th>Horse</th><th class="num">Bet if ≥</th><th>Live</th><th>Value</th><th class="num">Will-Pay</th><th class="num">%</th><th class="num">Fair</th>`;
  html += '</tr></thead><tbody>';
  for (const h of sorted) {
    html += `<tr class="${h.scratched ? 'scr' : ''}">`;
    html += `<td class="pgm" style="color:${pool.color}">${h.num}</td><td class="name">${escapeHtml(h.name)}</td>`;
    if (h.scratched || h.willPay === null) {
      html += `<td class="num">—</td><td>—</td><td>—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td>`;
    } else {
      const tgt = targetOdds(h.impliedProb, edgeMult);
      html += `<td class="num"><span class="target" style="color:#5cb85c;font-weight:600">${formatOdds(tgt)}</span></td>`;
      html += renderVerdictCell(h.num, h.impliedProb);
      html += `<td class="num">$${h.willPay.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>`;
      html += `<td class="num">${(h.impliedProb*100).toFixed(1)}%</td>`;
      html += `<td class="num" style="color:${pool.color};font-weight:600">${formatOdds(h.fairOdds)}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  html += `<div class="footer-note" style="margin-top:8px"><strong>Live</strong>: enter current win odds (e.g., "5", "5-1", "9/2"). <strong>Value</strong>: BET = ≥+${(edgeThreshold*100).toFixed(0)}% edge, CLOSE = halfway there, PASS = below.</div>`;
  return html;
}

function renderComparison(activePools) {
  const numSet = new Set();
  for (const p of activePools) p.horses.forEach(h => numSet.add(h.num));
  const nums = [...numSet].sort((a,b)=>a-b);
  const getH = (pool, n) => pool.horses.find(h => h.num === n);

  const sharpest = getSharpestPool(activePools);
  const shallowest = getShallowestPool(activePools);
  const edgeMult = 1 + edgeThreshold;

  const rows = nums.map(n => {
    const cells = activePools.map(p => {
      const h = getH(p, n);
      const scr = !h || h.scratched || h.willPay === null;
      return { pool: p, h, scr };
    });
    let name = `#${n}`;
    for (const c of cells) { if (c.h && c.h.name) { name = c.h.name; break; } }
    const allScr = cells.every(c => c.scr);
    const liveCells = cells.filter(c => !c.scr);
    const liveProbs = liveCells.map(c => c.h.impliedProb);
    const bestProb = liveProbs.length ? Math.max(...liveProbs) : 0;
    const minProb = liveProbs.length ? Math.min(...liveProbs) : 0;
    const spread = liveProbs.length >= 2 ? (bestProb - minProb) : 0;
    let topPool = null, botPool = null;
    if (liveProbs.length >= 2) {
      let topVal = -1, botVal = 2;
      for (const c of cells) {
        if (c.scr) continue;
        if (c.h.impliedProb > topVal) { topVal = c.h.impliedProb; topPool = c.pool; }
        if (c.h.impliedProb < botVal) { botVal = c.h.impliedProb; botPool = c.pool; }
      }
    }
    let betIf = null;
    let anchorProb = null;
    if (liveCells.length > 0) {
      const sharpCell = liveCells.find(c => c.pool.id === sharpest.id);
      const shallowCell = liveCells.find(c => c.pool.id === shallowest.id);
      const avgProb = liveProbs.reduce((s,p)=>s+p,0) / liveProbs.length;

      if (anchorMode === 'sharpest') {
        const p = sharpCell ? sharpCell.h.impliedProb : avgProb;
        anchorProb = p;
        betIf = { type: 'single', odds: targetOdds(p, edgeMult), color: sharpCell ? sharpCell.pool.color : '#5cb85c' };
      } else if (anchorMode === 'consensus') {
        anchorProb = avgProb;
        betIf = { type: 'single', odds: targetOdds(avgProb, edgeMult), color: '#5cb85c' };
      } else if (anchorMode === 'dual') {
        if (spread >= 0.03 && sharpCell && shallowCell && sharpest.id !== shallowest.id) {
          anchorProb = sharpCell.h.impliedProb;
          betIf = {
            type: 'dual',
            sharpOdds: targetOdds(sharpCell.h.impliedProb, edgeMult),
            sharpColor: sharpCell.pool.color,
            sharpLabel: sharpest.label,
            retailOdds: targetOdds(shallowCell.h.impliedProb, edgeMult),
            retailColor: shallowCell.pool.color,
            retailLabel: shallowest.label
          };
        } else {
          anchorProb = avgProb;
          betIf = { type: 'single', odds: targetOdds(avgProb, edgeMult), color: '#5cb85c' };
        }
      }
    }
    return { num: n, name, cells, allScr, bestProb, spread, topPool, botPool, betIf, anchorProb };
  });
  rows.sort((a,b) => (a.num || 0) - (b.num || 0));
  let html = '<div class="legend">';
  for (const p of activePools) {
    const depthMark = (p === sharpest && activePools.length >= 2) ? ' ★' : '';
    html += `<div class="legend-item"><span class="legend-dot" style="background:${p.color}"></span>${escapeHtml(p.label)}${depthMark}</div>`;
  }
  html += '</div>';
  html += '<div class="results-wrap"><table class="results"><thead><tr>';
  html += `<th>#</th><th>Horse</th><th class="num">Bet if ≥</th><th>Live</th><th>Value</th>`;
  for (const p of activePools) {
    html += `<th class="num" style="color:${p.color}">${escapeHtml(p.label)}</th>`;
  }
  if (activePools.length >= 2) html += `<th class="num">Spread</th>`;
  html += '</tr></thead><tbody>';
  for (const r of rows) {
    html += `<tr class="${r.allScr ? 'scr' : ''}">`;
    html += `<td class="pgm">${r.num}</td><td class="name">${escapeHtml(r.name)}</td>`;
    if (!r.betIf) {
      html += `<td class="num">—</td>`;
    } else if (r.betIf.type === 'single') {
      html += `<td class="num"><div class="bet-cell"><span class="target" style="color:${r.betIf.color}">${formatOdds(r.betIf.odds)}</span></div></td>`;
    } else {
      html += `<td class="num"><div class="bet-cell">`;
      html += `<div><span class="label">sharp</span> <span class="target" style="color:${r.betIf.sharpColor}">${formatOdds(r.betIf.sharpOdds)}</span></div>`;
      html += `<div><span class="label">retail</span> <span class="target" style="color:${r.betIf.retailColor}">${formatOdds(r.betIf.retailOdds)}</span></div>`;
      html += `</div></td>`;
    }
    if (r.allScr || !r.anchorProb) {
      html += `<td>—</td><td>—</td>`;
    } else {
      html += renderVerdictCell(r.num, r.anchorProb);
    }
    for (const c of r.cells) {
      if (c.scr) {
        html += `<td class="num">—</td>`;
      } else {
        const isTop = r.topPool && c.pool.id === r.topPool.id && r.spread >= 0.03;
        const isBot = r.botPool && c.pool.id === r.botPool.id && r.spread >= 0.03;
        const arrow = isTop ? ' ▲' : (isBot ? ' ▼' : '');
        html += `<td class="num"><div style="font-weight:600;color:${c.pool.color}">${formatOdds(c.h.fairOdds)}${arrow}</div><div style="font-size:11px;color:#8a929c">${(c.h.impliedProb*100).toFixed(1)}%</div></td>`;
      }
    }
    if (activePools.length >= 2) {
      if (r.spread > 0) {
        const pct = (r.spread * 100).toFixed(1);
        const color = r.spread >= 0.05 ? '#ffb84a' : (r.spread >= 0.03 ? '#5cb85c' : '#6a737d');
        html += `<td class="num" style="color:${color};font-weight:600">${pct}%</td>`;
      } else {
        html += `<td class="num">—</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  let footer = '<div class="footer-note" style="margin-top:8px"><strong>Live</strong>: type current win odds (e.g., "5", "5-1", "9/2"). <strong>Value</strong>: BET = ≥+' + (edgeThreshold*100).toFixed(0) + '% edge, CLOSE = halfway, PASS = below. Verdict uses sharp anchor when pools disagree.<br>';
  footer += '<strong>▲</strong> = pool most bullish, <strong>▼</strong> = least (spread ≥ 3%). <strong>Spread</strong> = gap between highest and lowest implied probability.<br>';
  if (anchorMode === 'sharpest') {
    footer += `<strong>Bet if ≥</strong> anchored on sharpest pool (★ ${escapeHtml(sharpest.label)}).`;
  } else if (anchorMode === 'consensus') {
    footer += `<strong>Bet if ≥</strong> anchored on average across pools.`;
  } else {
    footer += `<strong>Bet if ≥</strong> shows sharp (${escapeHtml(sharpest.label)}) and retail (${escapeHtml(shallowest.label)}) when pools disagree.`;
  }
  footer += '</div>';
  html += footer;
  return html;
}

function clearAll() {
  pools = [];
  nextId = 1;
  liveOdds = {};
  document.getElementById('output').innerHTML = '';
  addPool();
}

init();
</script>
